services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lightdey
      POSTGRES_USER: lightdey
      POSTGRES_PASSWORD: lightdey
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightdey"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://lightdey:lightdey@db:5432/lightdey
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
